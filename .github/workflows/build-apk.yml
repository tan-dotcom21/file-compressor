name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the Android project
        run: |
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FileCompressor"
          include ':app'
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.compressor.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.compressor.app"
                  minSdk 29
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Compressor</string>
          </resources>
          EOF_FILE
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0F0F10" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#D4FF3A" android:pathData="M54,50 L40,36 L48,36 L48,26 L60,26 L60,36 L68,36 Z" />
              <path android:fillColor="#D4FF3A" android:pathData="M54,58 L68,72 L60,72 L60,82 L48,82 L48,72 L40,72 Z" />
              <path android:fillColor="#F4F4F5" android:pathData="M32,52 L76,52 L76,56 L32,56 Z" />
          </vector>
          EOF_FILE
          mkdir -p app/src/main/java/com/compressor/app
          cat > app/src/main/java/com/compressor/app/MainActivity.java <<'EOF_FILE'
          package com.compressor.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private static final int PICK_FILES = 1001;
              private WebView web;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);

                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try {
                              startActivityForResult(Intent.createChooser(i, "Choose files"), PICK_FILES);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != PICK_FILES || fileCallback == null) return;
                  Uri[] result = null;
                  if (resultCode == RESULT_OK && data != null) {
                      ClipData clip = data.getClipData();
                      if (clip != null) {
                          result = new Uri[clip.getItemCount()];
                          for (int k = 0; k < clip.getItemCount(); k++) result[k] = clip.getItemAt(k).getUri();
                      } else if (data.getData() != null) {
                          result = new Uri[]{data.getData()};
                      }
                  }
                  fileCallback.onReceiveValue(result);
                  fileCallback = null;
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              /** Called from the page to save a compressed file into Downloads/Compressor. */
              private class Bridge {
                  @JavascriptInterface
                  public String saveFile(String name, String base64, String mime) {
                      try {
                          byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          v.put(MediaStore.Downloads.MIME_TYPE, mime);
                          v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Compressor");
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (uri == null) throw new Exception("could not create file");
                          try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                              if (out == null) throw new Exception("could not open file");
                              out.write(bytes);
                          }
                          final String text = "Saved to Downloads/Compressor/" + name;
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, text, Toast.LENGTH_SHORT).show());
                          return text;
                      } catch (Exception e) {
                          return "Save failed: " + e.getMessage();
                      }
                  }
              }
          }
          EOF_FILE
          mkdir -p app/src/main/assets && cp index.html app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk FileCompressor.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: FileCompressor-apk
          path: FileCompressor.apk

      - name: Publish the APK as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: File Compressor (latest build)
          files: FileCompressor.apk
          make_latest: true
